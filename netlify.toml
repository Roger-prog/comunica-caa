[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://vlibras.gov.br/app/ 'wasm-unsafe-eval'; style-src 'self' https://vlibras.gov.br 'unsafe-inline'; img-src 'self' https://vlibras.gov.br https://*.vlibras.gov.br data: blob: https://*.supabase.co https://static.arasaac.org; connect-src 'self' https://vlibras.gov.br https://*.vlibras.gov.br blob: https://*.supabase.co wss://*.supabase.co https://api.arasaac.org https://static.arasaac.org https://huggingface.co https://*.huggingface.co https://*.hf.co; worker-src 'self' blob:; frame-src 'self' https://vlibras.gov.br; font-src 'self' https://vlibras.gov.br; media-src https://vlibras.gov.br https://*.vlibras.gov.br 'self' data: blob:"
